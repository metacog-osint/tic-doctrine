name: privacy-guard
# Reusable check: fails a pull request that adds a local path, machine name or private file name.
on:
  workflow_call:
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: metacog-osint/tic-doctrine
          ref: main
          path: .tic-guard
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python .tic-guard/tic.py guard --base "$BASE_SHA"
