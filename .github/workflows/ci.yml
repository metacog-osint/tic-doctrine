name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: python tools/build_js.py --check
      - run: python tools/build_schema.py --check
      - run: python tests/test_kit.py
      - run: node tests/test_js.mjs
      - run: python tic.py lint tests/fixtures/good.geojson --doctrine templates/doctrine
      - run: python tic.py registers templates/doctrine
